version: 1
model: "Basic_Part_Design_Tutorial_017.fcstd"
description: "Basic Part Design Tutorial – simple view"

default:
  image_dir: "references"
  image_format: "png"
  threshold: 0.98
  fit_all: true

views:
  - id: "part_iso"
    label: "Isometric part view"
    type: "3d"
    orientation: "iso"
    display:
      mode: "shaded"
      size: [1600, 1200]
    output:
      filename: "part_iso.png"

  - id: "part_side"
    label: "Side orthographic view"
    type: "3d"
    orientation: "right"
    display:
      mode: "shaded"
      size: [1600, 1200]
    output:
      filename: "part_side.png"

  - id: "part_top"
    label: "Top orthographic view"
    type: "3d"
    orientation: "top"
    display:
      mode: "shaded"
      size: [1600, 1200]
    output:
      filename: "part_top.png"

