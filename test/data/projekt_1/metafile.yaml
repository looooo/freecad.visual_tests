version: 1
model: "EngineBlock.FCStd"
description: "Engine block example – basic isometric view"

default:
  image_dir: "references"
  image_format: "png"
  threshold: 0.98

views:
  - id: "engine_iso"
    label: "Isometric engine view"
    type: "3d"
    camera:
      position: [300, 300, 300]
      target: [0, 0, 0]
      up: [0, 0, 1]
      fov: 35.0
      projection: "perspective"
    display:
      mode: "shaded"
      size: [1600, 1200]
    output:
      filename: "engine_iso.png"

  - id: "engine_front"
    label: "Front orthographic view"
    type: "3d"
    camera:
      position: [0, -500, 0]
      target: [0, 0, 0]
      up: [0, 0, 1]
      fov: 1.0
      projection: "orthographic"
    display:
      mode: "shaded"
      size: [1600, 1200]
    output:
      filename: "engine_front.png"

  - id: "engine_top"
    label: "Top orthographic view"
    type: "3d"
    camera:
      position: [0, 0, 500]
      target: [0, 0, 0]
      up: [0, 1, 0]
      fov: 1.0
      projection: "orthographic"
    display:
      mode: "shaded"
      size: [1600, 1200]
    output:
      filename: "engine_top.png"

