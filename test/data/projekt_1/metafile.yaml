version: 1
model: "EngineBlock.FCStd"
description: "Engine block example – basic isometric view"

default:
  image_dir: "references"
  image_format: "png"
  threshold: 0.98
  fit_all: true

views:
  - id: "engine_iso"
    label: "Isometric engine view"
    type: "3d"
    orientation: "iso"
    display:
      mode: "shaded"
      size: [1600, 1200]
    output:
      filename: "engine_iso.png"

  - id: "engine_front"
    label: "Front orthographic view"
    type: "3d"
    orientation: "front"
    display:
      mode: "shaded"
      size: [1600, 1200]
    output:
      filename: "engine_front.png"

  - id: "engine_top"
    label: "Top orthographic view"
    type: "3d"
    orientation: "top"
    display:
      mode: "shaded"
      size: [1600, 1200]
    output:
      filename: "engine_top.png"

