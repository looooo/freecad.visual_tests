version: 1
model: "Sketcher_example_1.FCStd"
description: "Sketcher tutorial – sketch in edit mode (handled by framework via sketch_edit: true)"

default:
  image_dir: "references"
  image_format: "png"
  threshold: 0.98
  fit_all: true

views:
  - id: "sketch_edit"
    label: "Sketch in edit mode (constraints and geometry visible)"
    type: "3d"
    sketch_edit: true
    orientation: "top"
    display:
      mode: "shaded"
      size: [1600, 1200]
    output:
      filename: "sketch_edit.png"
      threshold: 0.90
