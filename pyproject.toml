[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freecad-visual-tests"
version = "0.1.0"
description = "GUI-based visual regression test framework for FreeCAD using pytest"
readme = "docs/API.md"
requires-python = ">=3.10"
authors = [
  { name = "Lorenz Lechner" }
]

dependencies = [
  "Pillow",
  "numpy",
  "pyyaml",
  "pytest",
]

[project.urls]
Homepage = "https://example.com/freecad-visual-tests"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["freecad*"]

